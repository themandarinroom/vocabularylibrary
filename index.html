<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Vocabulary Library · The Mandarin Room</title>
  <link rel="icon" href="assets/brand/emblem-header.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css?v=tool-header-1">
</head>
<body>
  <header class="site-header editor-site-header tmr-unified-header">
    <div class="tmr-brand">
      <a class="tmr-emblem-link" href="https://themandarinroom.au/" aria-label="The Mandarin Room home"><img class="tmr-emblem" src="assets/brand/emblem-header.png" width="56" height="53" alt=""></a>
      <span class="tmr-brand-text">
        <a class="tmr-home-link" href="https://themandarinroom.au/">The Mandarin Room</a>
        <a class="tmr-app-link" href="https://themandarinroom.au/#/vocabulary">Vocabulary Library</a>
      </span>
    </div>
    <a class="button primary" href="tools/word-randomizer/">Open Word Randomiser</a>
    <section class="voice-auth-panel home-auth-panel" aria-label="Teacher account">
      <strong id="voice-auth-state">Connecting…</strong>
      <div>
        <button id="voice-sign-in" class="button secondary" type="button">Teacher Sign in</button>
        <button id="voice-sign-out" class="button secondary" type="button" hidden>Sign out</button>
      </div>
    </section>
  </header>

  <main id="app" tabindex="-1">
    <section aria-label="Vocabulary sets">
      <div class="library-controls">
        <nav id="year-filters" class="filter-row" aria-label="Filter by year level"></nav>
        <p id="set-summary" class="muted"></p>
        <a id="new-set" class="button primary" href="editor.html" hidden>+ New set</a>
      </div>
      <div id="set-grid" class="set-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <span>App created by Wei Wang</span>
    <span>The Mandarin Room © 2026</span>
    <span>Vocabulary v0.4.2 · Aug 2026</span>
  </footer>
  <script type="module" src="js/app.js?v=duplicate-sets-1"></script>
</body>
</html>
